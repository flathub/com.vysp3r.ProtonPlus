id: com.vysp3r.ProtonPlus
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.vala
command: protonplus
finish-args:
  - --device=dri
  # Preserve controller support on older Flatpak clients, while newer clients
  # use the narrower input-device permission.
  - --device-if=all:!has-input-device
  - --device=input
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  # Ensure the bundled GSettings schema is discoverable in all Flatpak environments.
  - --env=GSETTINGS_SCHEMA_DIR=/app/share/glib-2.0/schemas
  # Host-spawn access is needed to check if host contains dependencies,
  # and to execute various compatibility tool installers on the host.
  - --talk-name=org.freedesktop.Flatpak
  # Required GNOME/GTK permissions.
  - --talk-name=org.gtk.vfs.*
  - --filesystem=xdg-run/gvfsd
  # Required because Steam libraries can be installed anywhere on the host.
  - --filesystem=host
  # Request access to supported Flatpak apps
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl/config/heroic
  - --filesystem=~/.var/app/com.usebottles.bottles/data/bottles
  - --filesystem=~/.var/app/com.valvesoftware.Steam/data/Steam
  - --filesystem=~/.var/app/net.lutris.Lutris/data/lutris
  - --filesystem=~/.var/app/io.github.fastrizwaan.WineZGUI/data/winezgui
build-options:
  append-path: /usr/lib/sdk/vala/bin
  prepend-ld-library-path: /usr/lib/sdk/vala/lib
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/aclocal
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - /share/vala
  - '*.a'
  - '*.la'
modules:
  # AppStream and its dependencies were removed from the GNOME 51 runtime.
  - name: libfyaml
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_NETWORK=OFF
      - -DENABLE_LIBCLANG=OFF
      - -DBUILD_TESTING=OFF
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/pantoniou/libfyaml/releases/download/v0.9.6/libfyaml-0.9.6.tar.gz
        sha256: a59cc3331e2eb903ec36933ad52a45888041cac31e44f553a00511131242c483
        x-checker-data:
          type: json
          url: https://api.github.com/repos/pantoniou/libfyaml/releases
          version-query: '[.[] | select(.prerelease == false and (.tag_name | test("^v[0-9.]+$")))]
            | first | .tag_name | sub("^v"; "")'
          url-query: '"https://github.com/pantoniou/libfyaml/releases/download/v" + $version
            + "/libfyaml-" + $version + ".tar.gz"'

  - name: libxmlb
    buildsystem: meson
    config-opts:
      - -Dstemmer=false
      - -Dintrospection=false
      - -Dgtkdoc=false
      - -Dtests=false
      - -Dcli=false
    cleanup:
      - /libexec
      - /share/installed-tests
    sources:
      - type: git
        url: https://github.com/hughsie/libxmlb.git
        tag: 0.3.29
        commit: d942cd68a7d78e35b312b9299e69f68f9cd2e503
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  - name: appstream
    buildsystem: meson
    config-opts:
      - -Dgir=true
      - -Dvapi=true
      - -Dcompose=false
      - -Dman=false
      - -Dapidocs=false
      - -Dstemming=false
      - -Dblake3-support=false
      - -Dsystemd=false
      - -Dbash-completion=false
      - -Dqt=false
    cleanup:
      - /bin
      - /lib/girepository-1.0
      - /share/gir-1.0
      - /share/installed-tests
    sources:
      - type: git
        url: https://github.com/ximion/appstream.git
        tag: v1.2.1
        commit: 4e3a4de973810e25bbada1b822185ed4d90eb1f5
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: ProtonPlus
    builddir: true
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/Vysp3r/ProtonPlus.git
        tag: v0.6.8
        commit: 6038800818562e6fbe6ac978c92544a756ffba73
        x-checker-data:
          type: git
          tag-pattern: ^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.\-]+)?)$
          version-scheme: semantic
          is-main-source: true
